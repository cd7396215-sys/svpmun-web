

<!DOCTYPE html>
<html lang='es'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1.0'><title>AI Chat UI</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:radial-gradient(circle at top,#10385e,#07111f 60%,#03070d);color:#fff;height:100vh;overflow:hidden}.wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;padding:20px}.greet{font-size:48px;font-weight:700;text-align:center}.sub{opacity:.8;margin-top:8px}.bar{margin-top:30px;width:min(900px,95%);display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(14px);padding:14px 16px;border-radius:24px;position:relative}.triangle{width:0;height:0;border-left:10px solid transparent;border-right:10px solid transparent;border-top:16px solid #000;cursor:pointer;filter:drop-shadow(0 0 2px #fff)}input{flex:1;background:transparent;border:none;outline:none;color:#fff;font-size:18px}.iconbtn{cursor:pointer;border:none;background:rgba(255,255,255,.08);color:#fff;padding:10px 12px;border-radius:14px}.menu{position:absolute;left:0;bottom:70px;width:320px;background:#111827;border:1px solid rgba(255,255,255,.1);border-radius:18px;padding:10px;display:none}.item{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;cursor:pointer}.item:hover{background:rgba(255,255,255,.08)}.item img{width:26px;height:26px;border-radius:50%}.carouselWrap{position:absolute;bottom:15px;width:100%;text-align:center}.track{display:flex;gap:50px;white-space:nowrap;animation:move 25s linear infinite}.track img{height:38px;filter:grayscale(1) brightness(1.2)}@keyframes move{from{transform:translateX(0)}to{transform:translateX(-50%)}}</style></head><body><div class='wrap'><div class='greet' id='greet'></div><div class='sub'>¿En qué puedo ayudarte hoy?</div><div class='bar'><div class='triangle' onclick='toggleMenu()'></div><div class='menu' id='menu'></div><input id='prompt' placeholder=''/><input type='file' id='file' hidden multiple><button class='iconbtn' onclick='document.getElementById("file").click()'>＋</button><button class='iconbtn' onclick='startRec()'>🎤</button><button class='iconbtn' onclick='sendMsg()'>↵</button></div></div><div class='carouselWrap'><div>Las IAs Provienen de:</div><div class='track' id='track'></div></div><script>const hour=new Date().getHours();document.getElementById('greet').innerText=hour<12?'Buenos días':hour<19?'Buenas tardes':'Buenas noches';const qs=[...'¿Cómo crear una web moderna?|Resume este PDF|Explícame Python|Haz una estrategia de ventas|Corrige este texto|Crea una imagen futurista|Analiza este contrato|Tradúcelo al inglés|Haz una dieta semanal|Escribe código FastAPI|Mejora mi CV|Ideas de negocio IA|Plan de marketing|Cómo aprender inglés|Haz un dashboard|Optimiza SEO|Diseña logo|Escribe poema|Plan de viaje|Haz chatbot|Analiza Excel|Genera SQL|Explica matemáticas|Resume reunión|Crea email profesional|Plan financiero|Ideas TikTok|Guion YouTube|Automatiza tareas|Configura servidor|Debug código|Mejorar ventas ecommerce|Campaña Meta Ads|Prompt engineering|Analiza competencia|Crea landing page|Estudia historia|Explica física|Aprender JavaScript|Haz presentación|Calendario contenidos|Plan gimnasio|Menú saludable|Carta ventas|Investigación mercado|Modelo negocio|Estrategia B2B|Cold email|Pitch startup|Encuesta clientes|UX app|Wireframe SaaS|Integrar API|Node.js ayuda|Docker básico|Linux comandos|Branding premium|Atención cliente|Soporte técnico|Roadmap producto|CRM ideal|ERP opciones|Data science|Machine learning|Fine tuning LLM|Análisis sentimientos|Regex ayuda|Macros Excel|Power BI|Tableau|Google Ads|Email funnel|Ventas WhatsApp|Telegram bot|Scraping web|Prompt legal|Contrato freelance|Factura plantilla|Cashflow|KPIs empresa|OKRs equipo|Hiring plan|Onboarding|Manual SOP|Copywriting ads|Storytelling marca|Plan podcast|Script reels|Campaña navidad|Ideas Black Friday|Gestión inventario|Forecast ventas|Negociación|Meditación guiada|Rutina mañana|Aprender rápido|Técnicas memoria'.split('|')];let i=0,j=0,dir=1;const inp=document.getElementById('prompt');setInterval(()=>{if(document.activeElement===inp||inp.value)return;let t=qs[i];inp.placeholder=t.slice(0,j);j+=dir;if(j>=t.length+6)dir=-1;if(j<=0){dir=1;i=(i+1)%qs.length;}},120);const models=[['NVIDIA Nemotron 3 Super','https://cdn.jsdelivr.net/npm/simple-icons@v11/icons/nvidia.svg'],['Llama 3.3 70B','https://cdn.jsdelivr.net/npm/simple-icons@v11/icons/meta.svg'],['Qwen 3.6 Plus','https://cdn.jsdelivr.net/npm/simple-icons@v11/icons/alibabacloud.svg'],['Gemma 3','https://cdn.jsdelivr.net/npm/simple-icons@v11/icons/google.svg'],['GPT-4o mini','https://cdn.jsdelivr.net/npm/simple-icons@v11/icons/openai.svg'],['Gemini 2.5 flash','https://cdn.jsdelivr.net/npm/simple-icons@v11/icons/google.svg']];const menu=document.getElementById('menu');models.forEach(m=>menu.innerHTML+=`<div class='item'><img src='${m[1]}'><span>${m[0]}</span></div>`);function toggleMenu(){menu.style.display=menu.style.display==='block'?'none':'block'}function sendMsg(){alert('Enviar: '+inp.value)}function startRec(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return alert('No compatible');const r=new SR();r.lang='es-ES';r.onresult=e=>inp.value=e.results[0][0].transcript;r.start()}inp.addEventListener('keydown',e=>{if(e.key==='Enter')sendMsg()});const logos=['openai','google','meta','nvidia','microsoft','amazon','alibabacloud'];const tr=document.getElementById('track');let html='';for(let k=0;k<3;k++)logos.forEach(l=>html+=`<img src='https://cdn.jsdelivr.net/npm/simple-icons@v11/icons/${l}.svg'>`);tr.innerHTML=html;</script></body></html>
