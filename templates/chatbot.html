<!DOCTYPE html>
<html lang='es'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1.0'><title>AI Chat UI Premium</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:radial-gradient(circle at 20% 0%,#1b4d7a,#091524 45%,#03070d 100%);color:#fff;height:100vh;overflow:hidden}.wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;padding:20px}.greet{font-size:56px;font-weight:800;text-align:center;letter-spacing:-1px;text-shadow:0 10px 30px rgba(0,0,0,.45)}.sub{opacity:.8;margin-top:8px}.bar{margin-top:34px;width:min(980px,95%);display:flex;align-items:center;gap:10px;background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,.06));border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(18px);padding:16px 18px;border-radius:28px;position:relative;box-shadow:0 20px 60px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.08)}.triangle{width:0;height:0;border-left:10px solid transparent;border-right:10px solid transparent;border-top:16px solid #000;cursor:pointer;filter:drop-shadow(0 0 2px #fff)}input{flex:1;background:transparent;border:none;outline:none;color:#fff;font-size:18px}.iconbtn{cursor:pointer;border:none;background:rgba(255,255,255,.08);color:#fff;padding:10px 12px;border-radius:14px;transition:.25s;box-shadow:0 8px 20px rgba(0,0,0,.2)}.iconbtn:hover{transform:translateY(-2px);background:rgba(255,255,255,.14)}.menu{position:absolute;left:0;bottom:78px;width:340px;background:rgba(17,24,39,.92);border:1px solid rgba(255,255,255,.12);border-radius:22px;padding:12px;display:none;box-shadow:0 30px 80px rgba(0,0,0,.45)}.item{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;cursor:pointer}.item:hover{background:rgba(255,255,255,.08)}.item img{width:26px;height:26px;border-radius:50%}.carouselWrap{position:absolute;bottom:18px;width:100%;text-align:center}.carouselWrap>div:first-child{font-size:14px;letter-spacing:.3px;opacity:.8;margin-bottom:10px}.track{display:flex;gap:50px;white-space:nowrap;animation:move 25s linear infinite}.track img{height:42px;object-fit:contain;filter:none;opacity:.95;padding:0 8px}.track{width:max-content;align-items:center}@keyframes move{from{transform:translateX(0)}to{transform:translateX(-33.333%)}}.sidebar{position:fixed;left:0;top:0;height:100vh;width:290px;background:rgba(8,12,20,.92);backdrop-filter:blur(18px);border-right:1px solid rgba(255,255,255,.08);padding:16px;display:flex;flex-direction:column;gap:10px;z-index:50;transition:.3s}.sidebar.hide{transform:translateX(-100%)}.sideTop{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.closeNav,.openNav,.navBtn{border:none;color:#fff;background:rgba(255,255,255,.08);padding:12px;border-radius:14px;cursor:pointer}.navBtn{text-align:left}.navBtn:hover,.closeNav:hover,.openNav:hover{background:rgba(255,255,255,.14)}.histTitle{margin-top:8px;opacity:.7;font-size:14px}.history{overflow:auto;display:flex;flex-direction:column;gap:8px}.chatItem{padding:10px;border-radius:12px;background:rgba(255,255,255,.05);cursor:pointer}.chatItem:hover{background:rgba(255,255,255,.1)}.openNav{position:fixed;left:14px;top:14px;z-index:40;display:none}.wrap{margin-left:290px;transition:.3s}.wrap.full{margin-left:0}@media(max-width:900px){.sidebar{width:260px}.wrap{margin-left:0}.openNav{display:block}}</style></head><body><div class='sidebar' id='sidebar'><div class='sideTop'><div class='triangle' onclick='toggleMenu()'></div><button class='closeNav' onclick='toggleNav()'>✕</button></div><button class='navBtn'>＋ Nuevo chat</button><button class='navBtn'>🔎 Buscar chats</button><button class='navBtn'>📁 Proyectos</button><button class='navBtn'>ℹ️ Conoce más de nosotros</button><div class='histTitle'>Historial:</div><div class='history'><div class='chatItem'>Chat de bienvenida</div><div class='chatItem'>Ideas de negocio IA</div><div class='chatItem'>Análisis de PDF</div></div></div><button class='openNav' onclick='toggleNav()' id='openNav'>☰</button><div class='wrap'><div class='greet' id='greet'></div><div class='sub'>¿En qué puedo ayudarte hoy?</div><div class='bar'><div class='triangle' onclick='toggleMenu()'></div><div class='menu' id='menu'></div><input id='prompt' placeholder=''/><input type='file' id='file' hidden multiple><button class='iconbtn' onclick='document.getElementById("file").click()'>＋</button><button class='iconbtn' onclick='startRec()'>🎤</button><button class='iconbtn' onclick='sendMsg()'>↵</button></div></div><div class='carouselWrap'><div>Las IAs Provienen de:</div><div class='track' id='track'></div></div><script>const hour=new Date().getHours();document.getElementById('greet').innerText=hour<12?'Buenos días':hour<19?'Buenas tardes':'Buenas noches';const qs=[...'¿Cómo crear una web moderna?|Resume este PDF|Explícame Python|Haz una estrategia de ventas|Corrige este texto|Crea una imagen futurista|Analiza este contrato|Tradúcelo al inglés|Haz una dieta semanal|Escribe código FastAPI|Mejora mi CV|Ideas de negocio IA|Plan de marketing|Cómo aprender inglés|Haz un dashboard|Optimiza SEO|Diseña logo|Escribe poema|Plan de viaje|Haz chatbot|Analiza Excel|Genera SQL|Explica matemáticas|Resume reunión|Crea email profesional|Plan financiero|Ideas TikTok|Guion YouTube|Automatiza tareas|Configura servidor|Debug código|Mejorar ventas ecommerce|Campaña Meta Ads|Prompt engineering|Analiza competencia|Crea landing page|Estudia historia|Explica física|Aprender JavaScript|Haz presentación|Calendario contenidos|Plan gimnasio|Menú saludable|Carta ventas|Investigación mercado|Modelo negocio|Estrategia B2B|Cold email|Pitch startup|Encuesta clientes|UX app|Wireframe SaaS|Integrar API|Node.js ayuda|Docker básico|Linux comandos|Branding premium|Atención cliente|Soporte técnico|Roadmap producto|CRM ideal|ERP opciones|Data science|Machine learning|Fine tuning LLM|Análisis sentimientos|Regex ayuda|Macros Excel|Power BI|Tableau|Google Ads|Email funnel|Ventas WhatsApp|Telegram bot|Scraping web|Prompt legal|Contrato freelance|Factura plantilla|Cashflow|KPIs empresa|OKRs equipo|Hiring plan|Onboarding|Manual SOP|Copywriting ads|Storytelling marca|Plan podcast|Script reels|Campaña navidad|Ideas Black Friday|Gestión inventario|Forecast ventas|Negociación|Meditación guiada|Rutina mañana|Aprender rápido|Técnicas memoria'.split('|')];let i=0,j=0,dir=1;const inp=document.getElementById('prompt');setInterval(()=>{if(document.activeElement===inp||inp.value)return;let t=qs[i];inp.placeholder=t.slice(0,j);j+=dir;if(j>=t.length+6)dir=-1;if(j<=0){dir=1;i=(i+1)%qs.length;}},120);const models=[['NVIDIA Nemotron 3 Super','https://upload.wikimedia.org/wikipedia/commons/2/21/Nvidia_logo.svg'],['Llama 3.3 70B','https://upload.wikimedia.org/wikipedia/commons/a/ab/Meta-Logo.png'],['Qwen 3.6 Plus','https://upload.wikimedia.org/wikipedia/commons/9/96/Alibaba.com_logo.svg'],['Gemma 3','https://upload.wikimedia.org/wikipedia/commons/2/2f/Google_2015_logo.svg'],['GPT-4o mini','https://upload.wikimedia.org/wikipedia/commons/4/4d/OpenAI_Logo.svg'],['Gemini 2.5 flash','https://upload.wikimedia.org/wikipedia/commons/2/2f/Google_2015_logo.svg']];const menu=document.getElementById('menu');models.forEach(m=>menu.innerHTML+=`<div class='item'><img src='${m[1]}'><span>${m[0]}</span></div>`);function toggleMenu(){menu.style.display=menu.style.display==='block'?'none':'block'}function sendMsg(){alert('Enviar: '+inp.value)}function startRec(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return alert('No compatible');const r=new SR();r.lang='es-ES';r.onresult=e=>inp.value=e.results[0][0].transcript;r.start()}inp.addEventListener('keydown',e=>{if(e.key==='Enter')sendMsg()});const logos=['https://upload.wikimedia.org/wikipedia/commons/4/4d/OpenAI_Logo.svg','https://upload.wikimedia.org/wikipedia/commons/2/2f/Google_2015_logo.svg','https://upload.wikimedia.org/wikipedia/commons/a/ab/Meta-Logo.png','https://upload.wikimedia.org/wikipedia/commons/2/21/Nvidia_logo.svg','https://upload.wikimedia.org/wikipedia/commons/4/44/Microsoft_logo.svg','https://upload.wikimedia.org/wikipedia/commons/a/a9/Amazon_logo.svg','https://upload.wikimedia.org/wikipedia/commons/9/96/Alibaba.com_logo.svg'];const tr=document.getElementById('track');let html='';for(let k=0;k<4;k++){logos.forEach(src=>html+=`<img src='${src}' onerror="this.style.display='none'">`)}tr.innerHTML=html;function toggleNav(){const s=document.getElementById('sidebar');const w=document.querySelector('.wrap');const o=document.getElementById('openNav');s.classList.toggle('hide');w.classList.toggle('full');o.style.display=s.classList.contains('hide')?'block':'none';}</script></body></html>
